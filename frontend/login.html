<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #080115 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        .form-toggle {
            display: flex;
            background: linear-gradient(45deg, #667eea, #764ba2);
            padding: 20px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 10px 10px 0 0;
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #e1e5e9;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .forgot-password {
            text-align: center;
            margin: 20px 0;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Toggle Buttons -->
        <div class="form-toggle">
            <button class="toggle-btn active" onclick="showForm('login')">Login</button>
            <button class="toggle-btn" onclick="showForm('register')">Register</button>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="form-container">
            <div id="loginMessage"></div>
            <form id="loginFormElement">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <div class="forgot-password">
                    <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
                </div>
            </form>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="form-container hidden">
            <div id="registerMessage"></div>
            <form id="registerFormElement">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgotPasswordForm" class="form-container hidden">
            <div id="forgotMessage"></div>
            <h3 style="text-align: center; margin-bottom: 20px; color: #333;">Reset Password</h3>
            <form id="forgotFormElement">
                <div class="form-group">
                    <label for="forgotEmail">Enter your email</label>
                    <input type="email" id="forgotEmail" required>
                </div>
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
                <div style="text-align: center; margin-top: 20px;">
                    <a href="#" onclick="showLoginForm()" style="color: #667eea; text-decoration: none;">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Simple in-memory user storage (in real app, use database)
        let users = JSON.parse(localStorage.getItem('users')) || [];

        // Form toggle functions
        function showForm(formType) {
            // Hide all forms
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('forgotPasswordForm').classList.add('hidden');
            
            // Remove active class from all toggle buttons
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            
            if (formType === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.querySelector('.toggle-btn:nth-child(1)').classList.add('active');
                clearMessage('loginMessage');
            } else if (formType === 'register') {
                document.getElementById('registerForm').classList.remove('hidden');
                document.querySelector('.toggle-btn:nth-child(2)').classList.add('active');
                clearMessage('registerMessage');
            }
        }

        function showForgotPassword() {
            showForm('login');
            setTimeout(() => {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('forgotPasswordForm').classList.remove('hidden');
            }, 300);
        }

        function showLoginForm() {
            document.getElementById('forgotPasswordForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }

        // Utility functions
        function showMessage(elementId, message, type) {
            const messageEl = document.getElementById(elementId);
            messageEl.textContent = message;
            messageEl.className = `message ${type}`;
            messageEl.classList.remove('hidden');
        }

        function clearMessage(elementId) {
            const messageEl = document.getElementById(elementId);
            messageEl.classList.add('hidden');
        }

        // Register form handler
        document.getElementById('registerFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;

            // Validation
            if (username.length < 3) {
                showMessage('registerMessage', 'Username must be at least 3 characters', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('registerMessage', 'Password must be at least 6 characters', 'error');
                return;
            }

            // Check if user already exists
            if (users.find(user => user.email === email)) {
                showMessage('registerMessage', 'Email already registered', 'error');
                return;
            }

            // Check if username already exists
            if (users.find(user => user.username === username)) {
                showMessage('registerMessage', 'Username already taken', 'error');
                return;
            }

            // Create new user
            const newUser = { username, email, password };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            showMessage('registerMessage', 'Registration successful! You can now login.', 'success');
            this.reset();
        });

        // Login form handler
        document.getElementById('loginFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                showMessage('loginMessage', `Welcome back, ${user.username}!`, 'success');
                // In real app, redirect to dashboard
                setTimeout(() => {
                    alert(`Login successful! Welcome ${user.username}`);
                }, 500);
            } else {
                showMessage('loginMessage', 'Invalid email or password', 'error');
            }
        });

        // Forgot password handler
        document.getElementById('forgotFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('forgotEmail').value.trim();
            const user = users.find(u => u.email === email);

            if (user) {
                showMessage('forgotMessage', 'Password reset link sent to your email!', 'success');
                // In real app, send email
            } else {
                showMessage('forgotMessage', 'Email not found', 'error');
            }
        });
    </script>
</body>
</html>
